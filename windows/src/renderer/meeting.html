<!doctype html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'"><title>Meeting · TakkieAI</title><link rel="stylesheet" href="meeting.css"></head><body>
<header><p class="brand">TakkieAI <span id="saved">Lokaal opgeslagen</span></p><h1 id="title">Meeting openen…</h1><nav role="tablist" aria-label="Meeting"><button role="tab" id="tab-notes" aria-controls="notes-panel" aria-selected="true">Eigen notities</button><button role="tab" id="tab-transcript" aria-controls="transcript-panel" aria-selected="false">Transcript</button><button role="tab" id="tab-summary" aria-controls="summary-panel" aria-selected="false">Samenvatting</button></nav></header>
<p id="error" role="alert" hidden></p>
<main><section id="notes-panel" role="tabpanel" aria-labelledby="tab-notes"><textarea id="notes" aria-label="Eigen notities" placeholder="Schrijf je gedachten op. Je notities worden automatisch lokaal bewaard."></textarea></section><section id="transcript-panel" role="tabpanel" aria-labelledby="tab-transcript" hidden><p id="transcript-empty" class="empty">Je transcript verschijnt na het afronden van de opname.</p><div id="transcript"></div></section><section id="summary-panel" role="tabpanel" aria-labelledby="tab-summary" hidden><p id="summary-empty" class="empty">Rond je opname af om een samenvatting te maken.</p><div id="summary"></div></section></main>
<footer><p id="status" role="status">Laden…</p><div class="controls"><button id="pause" hidden>Pauzeren</button><button id="stop" class="primary" hidden>Opname afronden</button><button id="generate" class="primary" hidden>Samenvatting maken</button></div></footer><script src="speakers.js"></script><script src="meeting.js"></script></body></html>
